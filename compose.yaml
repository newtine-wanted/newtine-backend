services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${DB_NAME:-newtine}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./compose/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      target: api
    environment:
      # The runtime image omits devDependencies, so local development uses
      # explicit JSON logging instead of the optional pino-pretty transport.
      NODE_ENV: development
      LOG_FORMAT: json
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-newtine}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_SLOW_THRESHOLD_MS: ${HTTP_SLOW_THRESHOLD_MS:-1000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
      RATE_LIMIT_AUTH_MAX_REQUESTS: ${RATE_LIMIT_AUTH_MAX_REQUESTS:-10}
      RATE_LIMIT_AUTH_ACCOUNT_MAX_REQUESTS: ${RATE_LIMIT_AUTH_ACCOUNT_MAX_REQUESTS:-5}
      RATE_LIMIT_REFRESH_MAX_REQUESTS: ${RATE_LIMIT_REFRESH_MAX_REQUESTS:-20}
      RATE_LIMIT_FEED_MAX_REQUESTS: ${RATE_LIMIT_FEED_MAX_REQUESTS:-30}
      RATE_LIMIT_SEARCH_MAX_REQUESTS: ${RATE_LIMIT_SEARCH_MAX_REQUESTS:-60}
      RATE_LIMIT_MAX_KEYS: ${RATE_LIMIT_MAX_KEYS:-10000}
      RATE_LIMIT_IDLE_TTL_MS: ${RATE_LIMIT_IDLE_TTL_MS:-120000}
      RATE_LIMIT_TRUST_PROXY_HOPS: ${RATE_LIMIT_TRUST_PROXY_HOPS:-0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env or the environment}
      JWT_ISSUER: ${JWT_ISSUER:-newtine-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-newtine-client}
      # Local Compose still exercises the secure-cookie setting explicitly.
      AUTH_COOKIE_SECURE: "true"
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      target: api
    command: ["node", "scripts/migrate.mjs", "up"]
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-newtine}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  batch:
    profiles:
      - tools
    build:
      context: .
      target: batch
    command: ["node", "dist/apps/batch/src/main.js", "databaseCheck"]
    environment:
      NODE_ENV: development
      LOG_FORMAT: json
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-newtine}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_SLOW_THRESHOLD_MS: ${HTTP_SLOW_THRESHOLD_MS:-1000}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PIPELINE_AI_CONFIG_PATH: ${PIPELINE_AI_CONFIG_PATH:-config/pipeline-ai.yml}
      PIPELINE_AI_MODEL: ${PIPELINE_AI_MODEL:-}
      PIPELINE_WORKER_POLL_MS: ${PIPELINE_WORKER_POLL_MS:-1000}
      PIPELINE_WORKER_ONCE: ${PIPELINE_WORKER_ONCE:-0}
      PIPELINE_EMBEDDING_REPAIR_RECLAIM_OWNER: ${PIPELINE_EMBEDDING_REPAIR_RECLAIM_OWNER:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  report-worker:
    profiles:
      - reports
    build:
      context: .
      target: batch
    command: ["node", "dist/apps/batch/src/main.js", "reportWorker"]
    environment:
      NODE_ENV: development
      LOG_FORMAT: json
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-newtine}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REPORT_AI_MODEL: ${REPORT_AI_MODEL:-}
      REPORT_AI_TIMEOUT_MS: ${REPORT_AI_TIMEOUT_MS:-60000}
      REPORT_WORKER_POLL_MS: ${REPORT_WORKER_POLL_MS:-1000}
      REPORT_WORKER_LEASE_MS: ${REPORT_WORKER_LEASE_MS:-180000}
      REPORT_WORKER_HEARTBEAT_MS: ${REPORT_WORKER_HEARTBEAT_MS:-30000}
      REPORT_WORKER_EXECUTION_TIMEOUT_MS: ${REPORT_WORKER_EXECUTION_TIMEOUT_MS:-300000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 75s

volumes:
  postgres-data:
